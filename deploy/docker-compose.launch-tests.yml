# Disposable infrastructure for launch regression tests; no application data volumes.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paykey
      POSTGRES_PASSWORD: launch-tests-only
      POSTGRES_DB: paykey_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paykey -d paykey_test"]
      interval: 2s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
