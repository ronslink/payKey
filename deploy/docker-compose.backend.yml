# Production backend. Use deploy/deploy-backend.sh after the CI gates pass.
services:
  backend:
    image: ${BACKEND_IMAGE:?An immutable backend image digest is required}
    container_name: paykey_backend_prod
    restart: always
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      RELEASE_COMMIT: ${RELEASE_COMMIT:?A release commit is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_SSL_CA_PATH: /app/ca-certificate.crt
      NODE_EXTRA_CA_CERTS: /app/ca-certificate.crt
      REDIS_HOST: paykey_redis_prod
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Read-only Docker API for the admin container/log views (docker-socket-proxy).
      DOCKER_PROXY_URL: http://paykey_docker_proxy_prod:2375
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTASEND_PUBLISHABLE_KEY: ${INTASEND_PUBLISHABLE_KEY:?A live publishable key is required}
      INTASEND_SECRET_KEY: ${INTASEND_SECRET_KEY:?A live secret key is required}
      INTASEND_IS_LIVE: 'true'
      INTASEND_SIMULATE: 'false'
      INTASEND_DISABLE_SIG_CHECK: 'false'
      INTASEND_CHALLENGE: ${INTASEND_CHALLENGE:-}
      INTASEND_WEBHOOK_SECRET: ${INTASEND_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?A live Stripe API key is required}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?A live Stripe publishable key is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?A Stripe webhook signing secret is required}
      STRIPE_WALLET_FUNDING_ENABLED: ${STRIPE_WALLET_FUNDING_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      WEBSITE_URL: https://paydome.co
      FRONTEND_URL: https://paydome.co
      API_URL: https://api.paydome.co
      STORAGE_ROOT: /app/storage
      LEGACY_UPLOADS_DIR: /app/legacy-uploads
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-MOCK}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@paydome.co}
      SMS_PROVIDER: ${SMS_PROVIDER:-MOCK}
      AFRICANSTALKING_API_KEY: ${AFRICANSTALKING_API_KEY:-}
      AFRICANSTALKING_USERNAME: ${AFRICANSTALKING_USERNAME:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/secrets/firebase-service-account.json
    volumes:
      - /opt/paykey/ca-certificate.crt:/app/ca-certificate.crt:ro
      - /opt/paykey/storage:/app/storage
      - /opt/paykey/legacy-uploads:/app/legacy-uploads:ro
      - /opt/paykey/secrets:/app/secrets:ro
    networks:
      - paykey-network-prod
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/health/ready']
      interval: 15s
      timeout: 6s
      retries: 6
      start_period: 30s

networks:
  paykey-network-prod:
    external: true
