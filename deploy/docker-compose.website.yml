# Website service for production, released after its matching backend commit.
# Use deploy/deploy-website.sh with the CI-produced immutable image digest.

services:
  website:
    image: ${WEBSITE_IMAGE:?An immutable website image digest is required}
    container_name: paydome_website_prod
    restart: always
    labels:
      org.opencontainers.image.revision: ${RELEASE_COMMIT:?A release commit is required}
    ports:
      - "8080:80"
    networks:
      - paykey-network-prod
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  paykey-network-prod:
    external: true
