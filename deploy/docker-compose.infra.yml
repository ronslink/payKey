# Managed PostgreSQL lives outside this stack. Redis data survives releases.
services:
  redis:
    image: redis:7-alpine
    container_name: paykey_redis_prod
    restart: always
    stop_grace_period: 30s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data_prod:/data
    networks:
      - paykey-network-prod
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  redis_data_prod:
    name: ${REDIS_DATA_VOLUME:-paykey_redis_data_prod}

networks:
  paykey-network-prod:
    external: true
