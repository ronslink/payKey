name: Backend CI and verified deployment

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
      - '.github/workflows/backend-*.yml'
      - '.github/workflows/deploy-prod*.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
      - '.github/workflows/backend-*.yml'
      - '.github/workflows/deploy-prod*.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'production-backend' || format('backend-ci-{0}', github.ref) }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  backend-ci:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: paykey
          POSTGRES_PASSWORD: local_ci_database_password
          POSTGRES_DB: paykey_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: ''
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: paykey
      DB_USERNAME: paykey
      DB_PASSWORD: local_ci_database_password
      DB_NAME: paykey_test
      DB_LOGGING: 'false'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: test_secret_key_for_ci_cd_pipeline_12345
      INTASEND_IS_LIVE: 'false'
      INTASEND_SIMULATE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Block introduced lint diagnostics (retain full legacy report)
        run: node scripts/lint-regression.cjs
      - name: Build
        run: npm run build
      - name: Unit and security regression tests
        run: npm test -- --runInBand
      - name: Deployment configuration regression tests
        run: node --test ../deploy/create-production-env.test.cjs ../deploy/audit-production.test.cjs
      - name: Check deployment shell syntax
        run: bash -n ../deploy/deploy-backend.sh
      - name: Prepare isolated test database
        run: npm run typeorm:schema:sync
      - name: E2E tests against isolated services
        run: npm run test:e2e
        timeout-minutes: 15
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/coverage/
            backend/test-results/

  docker-build:
    name: Build immutable image
    runs-on: ubuntu-latest
    needs: backend-ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push exact tested commit
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/paykey-backend:${{ github.sha }}
          build-args: RELEASE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy verified image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: docker-build
    environment: PROD
    env:
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Stage release scripts
        run: |
          umask 077
          mkdir -p release/deploy
          cp deploy/deploy-backend.sh deploy/docker-compose.backend.yml deploy/docker-compose.infra.yml release/deploy/
      - name: Validate and stage new production configuration
        env:
          BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/paykey-backend@${{ needs.docker-build.outputs.digest }}
          RELEASE_COMMIT: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          INTASEND_PUBLISHABLE_KEY: ${{ secrets.INTASEND_PUB_KEY_PROD }}
          INTASEND_SECRET_KEY: ${{ secrets.INTASEND_SECRET_KEY_PROD }}
          INTASEND_WEBHOOK_SECRET: ${{ secrets.INTASEND_WEBHOOK_SECRET }}
          INTASEND_CHALLENGE: ${{ secrets.INTASEND_CHALLENGE }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ vars.SENDGRID_FROM_EMAIL }}
          SMS_PROVIDER: ${{ vars.SMS_PROVIDER }}
          AFRICANSTALKING_API_KEY: ${{ secrets.AFRICANSTALKING_API_KEY }}
          AFRICANSTALKING_USERNAME: ${{ vars.AFRICANSTALKING_USERNAME }}
        run: node deploy/create-production-env.cjs release/.env.candidate
      - name: Upload staged release without touching live environment
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: release/
          strip_components: 1
          target: /opt/paykey/releases/${{ env.RELEASE_ID }}
      - name: Release backend and preserve rollback state
        uses: appleboy/ssh-action@v1.0.0
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,RELEASE_ID
          command_timeout: 18m
          script: |
            set -eu
            printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            bash "/opt/paykey/releases/$RELEASE_ID/deploy/deploy-backend.sh" "/opt/paykey/releases/$RELEASE_ID"
      - name: Remove runner copy of production configuration
        if: always()
        run: rm -f release/.env.candidate

  website-release:
    name: Release website after backend readiness
    needs: deploy
    uses: ./.github/workflows/deploy-website.yml
    with:
      release_sha: ${{ github.sha }}
    secrets: inherit
