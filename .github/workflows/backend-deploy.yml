name: Backend deploy (with required tests)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect the running production system or deploy a verified main-branch release'
        type: choice
        default: inspect
        options: [inspect, release]

permissions:
  contents: read

jobs:
  inspect-production:
    if: inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: PROD
    steps:
      - uses: actions/checkout@v4
      - name: Confirm target and configured release credentials without revealing values
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          node - <<'JS'
          if (process.env.DO_HOST !== '46.101.95.200') { console.error('Unexpected production SSH target'); process.exit(1); }
          const e = process.env;
          let u;
          try { u = new URL(e.DATABASE_URL); } catch { console.error('Invalid configured database URL'); process.exit(1); }
          console.log(JSON.stringify({source:'GitHub PROD',database:{host:u.hostname,port:u.port||'5432',name:u.pathname.slice(1)},redisPasswordConfigured:!!e.REDIS_PASSWORD,jwtMinimumLength:(e.JWT_SECRET||'').length>=32,stripeLiveKey:/^(sk|rk)_live_/.test(e.STRIPE_SECRET_KEY||''),stripeWebhookConfigured:(e.STRIPE_WEBHOOK_SECRET||'').startsWith('whsec_')}));
          JS
      - name: Encode read-only inspection script
        run: echo "PRODUCTION_INSPECTION_SCRIPT=$(base64 -w0 deploy/inspect-running-production.cjs)" >> "$GITHUB_ENV"
      - name: Inspect running backend without changing services or data
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: PRODUCTION_INSPECTION_SCRIPT
          command_timeout: 3m
          script: |
            set -eu
            docker inspect --format 'backend image={{.Image}} running={{.State.Running}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}' paykey_backend_prod
            docker inspect --format '{{range .Mounts}}mount type={{.Type}} destination={{.Destination}}{{println}}{{end}}' paykey_backend_prod
            if test -s /opt/paykey/ca-certificate.crt; then echo 'host database CA present'; else echo 'host database CA missing'; fi
            df -Pk /opt/paykey | tail -1 | awk '{print "available_disk_kb=" $4}'
            printf '%s' "$PRODUCTION_INSPECTION_SCRIPT" | base64 -d | docker exec -i -w /app paykey_backend_prod node
  verified-release:
    if: inputs.mode == 'release' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit
